# everything except for this map section is the same content as in nginx_base_conf
# https://github.com/FAIRmat-NFDI/nomad-distro-template/blob/9071d023f6142bc3920bb7c30aa17e543bb37fea/configs/nginx_base_conf
# except for that:
# - the content is wrapped into a server group {}
# - there is an additional listen 80
# - there is an additional server_name  localhost  # should this remain this parameter value?
# - there is an additional proxy_set_header Host $host

# the nomad-distro-template though includes an additional
# https://github.com/FAIRmat-NFDI/nomad-distro-template/blob/9071d023f6142bc3920bb7c30aa17e543bb37fea/configs/nginx_http.conf
# https://github.com/FAIRmat-NFDI/nomad-distro-template/blob/9071d023f6142bc3920bb7c30aa17e543bb37fea/configs/nginx_https.conf
# it seems to me that it is current best practice to include all three nginx*.conf files, the nginx_https.conf mentions the nginx_base_conf
# this be added to the nginx.conf here ?
# shall we rename this file here

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen        80;
    server_name   localhost;
    proxy_set_header Host $host;

    gzip_min_length     1000;
    gzip_buffers        4 8k;
    gzip_http_version   1.0;
    gzip_disable        "msie6";
    gzip_vary           on;
    gzip on;
    gzip_proxied any;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/x-javascript
        application/json;

    location / {
        proxy_pass http://app:8000;
    }

    location ~ /nomad-oasis\/?(gui)?$ {
        rewrite ^ /nomad-oasis/gui/ permanent;
    }

    location /nomad-oasis/gui/ {
        proxy_intercept_errors on;
        error_page 404 = @redirect_to_index;
        proxy_pass http://app:8000;
    }

    location @redirect_to_index {
        rewrite ^ /nomad-oasis/gui/index.html break;
        proxy_pass http://app:8000;
    }

    location /nomad-oasis/docs/ {
        # This is added to force a redirect (302) when 404 otherwise
        # the assets are not loaded correctly (a broken page rendered)
        proxy_intercept_errors on;
        error_page 404 = @docs404redirect;
        proxy_pass http://app:8000;
    }

    location @docs404redirect {
        return 302 /nomad-oasis/docs/404.html;
    }

    location ~ \/gui\/(service-worker\.js|meta\.json)$ {
        add_header Last-Modified $date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        if_modified_since off;
        expires off;
        etag off;
        proxy_pass http://app:8000;
    }

    location ~ /api/v1/uploads(/?$|.*/raw|.*/bundle?$)  {
        client_max_body_size 35g;
        proxy_request_buffering off;
        proxy_pass http://app:8000;
    }

    location ~ /api/v1/.*/download {
        proxy_buffering off;
        proxy_pass http://app:8000;
    }

    location /nomad-oasis/north/ {
        client_max_body_size 500m;
        proxy_pass http://north:9000;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # websocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Scheme $scheme;

        proxy_buffering off;
    }
}
